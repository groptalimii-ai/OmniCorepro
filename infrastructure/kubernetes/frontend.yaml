# إصلاح فجوة نشر: لم يكن يوجد أي مانيفست Kubernetes للواجهة الأمامية إطلاقًا -
# كان مجلد infrastructure/kubernetes/ يحتوي backend.yaml فقط، رغم أن frontend/
# لديها Dockerfile كامل (nginx متعدد المراحل) جاهز للبناء والنشر. بلا هذا الملف
# لا توجد طريقة لنشر الواجهة الأمامية على Kubernetes إطلاقًا رغم توفر صورتها.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: enterpriseai
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # صورة nginx:alpine الأساسية (راجع frontend/Dockerfile) تعمل كـroot افتراضيًا
      # ما لم تُعدَّل صراحة - غير مُعدَّلة حاليًا في Dockerfile نفسه (بخلاف backend
      # الذي يملك USER enterpriseai صريحًا). التشديد هنا على مستوى Pod/Container
      # فقط يمنع الامتيازات الإضافية، ولا يفرض runAsNonRoot لتفادي كسر الصورة
      # الحالية بلا تعديل Dockerfile الخاص بها أولاً (nginx يحتاج صلاحيات ربط منفذ
      # <1024 عادة، لكن هنا EXPOSE 3000 وهو >1024 فلا حاجة فعلية لـroot - يُنصح
      # بإضافة USER محدَّد في frontend/Dockerfile أيضًا لاحقًا لتفعيل runAsNonRoot هنا).
      containers:
      - name: frontend
        image: enterpriseai/frontend:__BUILD_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # nginx يخدم ملفات ثابتة فقط - فحص "/" كافٍ ودقيق لكل من liveness وreadiness
        # هنا (بخلاف backend، لا توجد تبعيات خارجية تستدعي فصل المسارين).
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: enterpriseai
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 3000
    targetPort: http
  type: ClusterIP
