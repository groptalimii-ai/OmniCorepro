# قالب توثيقي - لا تُطبِّق هذا الملف كما هو، ولا تضع فيه قيمًا حقيقية ولا تُدرجه
# في git. أنشئ الأسرار الفعلية عبر أحد المسارين التاليين:
#
# 1) سطر أوامر (مُستحسَن لمعظم الحالات - لا يمر عبر أي ملف على القرص):
#    kubectl create secret generic app-secrets -n enterpriseai \
#      --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#      --from-literal=encryption-key="$(openssl rand -base64 48)" \
#      --from-literal=secret-key="$(openssl rand -base64 48)"
#
#    kubectl create secret generic db-credentials -n enterpriseai \
#      --from-literal=url="postgresql://enterpriseai:<REAL_PASSWORD>@postgres:5432/enterpriseai"
#
# 2) أداة إدارة أسرار حقيقية لبيئة إنتاجية متعددة العملاء (المُستحسَن فعليًا لمنتج
#    يُباع لأكثر من شركة): External Secrets Operator + Vault/AWS Secrets Manager/
#    GCP Secret Manager بدل kubectl مباشرة، حتى تُدار الأسرار الفعلية خارج أي كتلة
#    Kubernetes ولكل عميل مساحة أسرار منفصلة تمامًا.
#
# إصلاح: كان backend.yaml السابق لا يشير إطلاقًا إلى ENCRYPTION_KEY أو SECRET_KEY -
# فقط jwt من app-secrets وurl من db-credentials. أُضيفا هنا للتوثيق الكامل.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: enterpriseai
type: Opaque
stringData:
  jwt-secret: "REPLACE_ME_GENERATE_VIA_OPENSSL_RAND_BASE64_48"
  encryption-key: "REPLACE_ME_GENERATE_VIA_OPENSSL_RAND_BASE64_48"
  secret-key: "REPLACE_ME_GENERATE_VIA_OPENSSL_RAND_BASE64_48"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: enterpriseai
type: Opaque
stringData:
  url: "postgresql://enterpriseai:REPLACE_ME_REAL_PASSWORD@postgres:5432/enterpriseai"
